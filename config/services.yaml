services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\SiteBundle\:
        resource: '../src/'
        exclude: '../src/Entity/'

    # VichUploaderBundle only registers its concrete UploaderHelper as a service, no alias for its own interface - CollectionItemSourceProvider autowires against the interface for testability
    Vich\UploaderBundle\Templating\Helper\UploaderHelperInterface: '@Vich\UploaderBundle\Templating\Helper\UploaderHelper'

    c975L\SiteBundle\Service\StylesheetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 100 }
            - { name: 'ui.management_stylesheet' }

    c975L\SiteBundle\Service\ScriptProvider:
        tags:
            - { name: 'ui.script', priority: 100 }
            - { name: 'ui.admin_script', priority: 100 }

    site.block.twig_content:
        class: stdClass
        tags:
            - name: ui.block
              kind: twig_content
              label: "block.twig_content"
              description: "block.twig_content_description"
              translation_domain: 'site'
              form: c975L\SiteBundle\Form\Block\TwigContentType
              template: '@c975LSite/blocks/TwigContent.html.twig'
              category: 'label.category_twig'
              pickable: true
              # Not cacheable: on a collection's detail Page, its output varies per request with "collectionItem" (see CollectionItemContext) - a persisted Block's id-keyed cache (BlockExtension::renderBlock()) has no way to see that, and would otherwise serve whichever item first got cached to every other item's URL
              cacheable: false

    site.block.articles_slider:
        class: stdClass
        tags:
            - name: ui.block
              kind: articles_slider
              label: "block.articles_slider"
              description: "block.articles_slider_description"
              translation_domain: 'site'
              form: c975L\SiteBundle\Form\Block\ArticlesSliderType
              template: '@c975LSite/blocks/ArticlesSlider.html.twig'
              category: 'label.category_navigation'
              pickable: true
              cacheable: true

    site.block.menu_link:
        class: stdClass
        tags:
            - name: ui.block
              kind: menu_link
              label: "block.menu_link"
              description: "block.menu_link_description"
              translation_domain: 'site'
              form: c975L\SiteBundle\Form\Block\MenuLinkType
              template: '@c975LSite/blocks/MenuLink.html.twig'
              category: 'label.category_navigation'
              pickable: true
              cacheable: false
              # "menu_navbar" is an exclusive context (see BlockRegistry::EXCLUSIVE_CONTEXTS): opting in here is what makes this the only kind a navbar ever offers, every other menu location ("menu") keeping the full picker. "menu_slot" is the slot context of the "menu_group" below: without it a link couldn't be picked - nor dragged, see BlockMoveController::validateTarget() - into a group. UiBundle's own "flex_slot" is deliberately left out, a link having no business being offered in a container placed on a Page
              contexts: 'menu,menu_navbar,menu_slot'

    # The chromeless wrapper a menu's items are laid out in, e.g. a footer's social links on their own line above its links - UiBundle's "block_group" reused as is (same form, same template, same ".blocks-group" markup), the only difference being where it can be picked. Its own kind rather than "block_group" itself so a menu's grouping stays out of a Page's containers: "menu_link" opts into "menu_slot" alone, and this kind into "menu" alone, which also keeps it out of a navbar (links only, see the exclusive context above).
    # "menu_slot" being a slot context, BlockRegistry::isAllowedInContext() excludes containers from it, so a group can't hold another group - the one-level tree Footer.html.twig walks
    site.block.menu_group:
        class: stdClass
        tags:
            - name: ui.block
              kind: menu_group
              label: "block.menu_group"
              description: "block.menu_group_description"
              translation_domain: 'site'
              form: c975L\UiBundle\Form\Block\BlockGroupType
              template: '@c975LUi/blocks/BlockGroup.html.twig'
              category: 'label.category_navigation'
              pickable: true
              cacheable: false
              container: true
              contexts: 'menu'
              slot_context: 'menu_slot'
